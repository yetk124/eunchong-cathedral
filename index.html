<!doctype html>
<html lang="ko">
<head>
<title>Ave</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D cathedral, glass HUD on the top edge, five-button dock at the bottom; entry wardrobe, rosary and sheets as overlays */
:root{
  --bg:#0c0b11;
  --glass:rgba(22,20,29,.72);
  --glass-strong:rgba(18,16,24,.95);
  --line:rgba(239,232,218,.13);
  --fg:#efe8da;
  --muted:#a69f92;
  --gold:#d8b36a;
  --gold-soft:rgba(216,179,106,.16);
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.top > *{pointer-events:auto}
.chip{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 14px;border-radius:999px;font-size:13px;font-weight:500;min-width:0;max-width:46vw}
.chip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .caret{opacity:.6;width:14px;height:14px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tools{display:flex;align-items:center;gap:0;height:40px;padding:0 4px 0 12px;border-radius:999px;font-size:13px}
.tools .count{display:flex;align-items:center;gap:5px;margin-right:4px;font-variant-numeric:tabular-nums;font-weight:500}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.icon-btn:hover{background:var(--gold-soft)}
.pill{height:34px;padding:0 14px;border-radius:999px;font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill.on{color:var(--gold);border-color:rgba(216,179,106,.4)}

.banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 104px);transform:translateX(-50%);text-align:center;z-index:4;pointer-events:none;transition:opacity .9s;opacity:0;width:min(92vw,420px)}
.banner.show{opacity:1}
.banner span{font-size:11.5px;letter-spacing:.08em;color:var(--gold);text-shadow:0 1px 8px #000}
.banner b{display:block;margin-top:2px;font-family:var(--display);font-size:26px;font-weight:700;text-shadow:0 2px 14px #000;text-wrap:balance}

.greetreq{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 94px);z-index:6;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:999px;font-size:13px;white-space:nowrap;max-width:92vw}
.greetreq span{overflow:hidden;text-overflow:ellipsis}
.greetreq button{height:32px;padding:0 14px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-size:12.5px;font-weight:600;flex:none}
.joy{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);width:112px;height:112px;border-radius:50%;background:rgba(20,16,24,.35);border:1px solid rgba(216,179,106,.35);z-index:5;touch-action:none;backdrop-filter:blur(6px)}
.joy .knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(216,179,106,.55);box-shadow:0 2px 10px rgba(0,0,0,.3)}
body.in-confess .joy,body.in-adore .joy{display:none}
.volpop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 66px);z-index:8;padding:12px 16px;border-radius:18px;width:min(260px,80vw);display:flex;flex-direction:column;gap:10px}
.volpop label{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.volpop input{width:100%;accent-color:#d8b36a}
.posebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);display:flex;gap:2px;padding:4px;border-radius:999px;z-index:5}
.posebar button{height:32px;padding:0 13px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.posebar button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold)}
.tip{position:fixed;z-index:7;pointer-events:none;padding:6px 10px;border-radius:10px;background:rgba(30,22,16,.86);border:1px solid rgba(216,179,106,.35);color:#f3e6cc;font-size:12px;line-height:1.35;max-width:220px;transform:translate(12px,12px)}
.tip em{display:block;font-style:normal;font-size:10.5px;color:#c9a96a}
.status{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:4;pointer-events:none;width:min(92vw,360px)}
.status p{margin:0;font-size:12px;color:var(--muted);text-shadow:0 1px 6px #000}
.status .bar{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 16px;border-radius:999px;font-size:13px}
.status .bar b{font-weight:500}
.status .bar .t{font-variant-numeric:tabular-nums;color:var(--gold)}
.status .bar button{padding:6px 12px;border-radius:999px;background:rgba(239,232,218,.08);font-size:12.5px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 170px);transform:translate(-50%,8px);opacity:0;transition:.3s;padding:9px 16px;border-radius:999px;font-size:13px;z-index:45;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;gap:4px;padding:6px;border-radius:26px;z-index:5}
.dock button{width:min(62px,calc((100vw - 54px)/6));height:58px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--muted);transition:background .2s,color .2s}
.dock button svg{width:20px;height:20px}
.dock button span{white-space:nowrap;letter-spacing:-.02em}
@media (max-width:420px){.dock button{font-size:10.5px}}
.dock button:hover{color:var(--fg)}
.dock button.active{background:var(--gold-soft);color:var(--gold)}

.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 94px);text-align:center;font-size:11.5px;color:var(--fg);opacity:.85;z-index:3;pointer-events:none;transition:opacity .6s;padding-inline:16px;text-shadow:0 1px 6px #000}
body.in-entry .top,body.in-entry .dock,body.in-entry .hint,body.in-entry .status,body.in-entry .banner,body.in-entry .objcard{display:none!important}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,4,8,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 60px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:min(420px,100%);max-height:calc(100% - 110px);display:flex;flex-direction:column;border-radius:24px;background:var(--glass-strong);border:1px solid var(--line);overflow:hidden}
.sheet header{padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{margin:0;font-family:var(--display);font-size:21px;font-weight:700;text-wrap:balance}
.sheet .sub{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.sheet .meta{display:flex;justify-content:space-between;gap:12px;padding:0 20px 10px;font-size:11.5px;color:var(--muted)}
.sheet .meta button{font-size:11.5px;color:var(--fg);flex:none}
.rooms{overflow-y:auto;padding:4px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.room{text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,var(--rc,#2a2230) 0%,rgba(18,16,24,0) 75%);display:flex;flex-direction:column;gap:3px;min-width:0}
.room em{font-style:normal;font-size:10.5px;letter-spacing:.04em;color:var(--muted)}
.room b{font-family:var(--display);font-size:14.5px;font-weight:700;line-height:1.3}
.room span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.room.cur{border-color:rgba(216,179,106,.6)}
.room.cur span,.room.cur em{color:var(--gold)}

.sheet.paper{width:min(440px,100%);box-sizing:border-box;max-height:min(86vh,780px);margin:auto 0;background:url(tex/paper.webp) center/100% 100% no-repeat;border:0;border-radius:0;color:#3b2414;--muted:#7a5a3c;--line:rgba(90,56,28,.28);
  padding:clamp(34px,9%,52px) clamp(30px,9%,48px) clamp(40px,11%,62px);filter:drop-shadow(0 18px 30px rgba(0,0,0,.55));backdrop-filter:none;-webkit-backdrop-filter:none;font-family:"Gowun Batang",serif}
.sheet.paper header{padding:4px 2px 6px}
#roomSheet{align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 50px);padding-bottom:16px}
.sheet.paper .rooms{min-height:0;flex:1 1 auto}
.sheet.paper h2{font-family:"Nanum Pen Script",cursive;font-weight:400;font-size:42px;line-height:1;color:#3a1e0e;letter-spacing:.01em}
.sheet.paper .sub{font-family:"Nanum Pen Script",cursive;font-size:20px;line-height:1.25;color:#5c3c22;margin-top:6px}
.sheet.paper .meta{padding:2px 2px 8px;font-family:"Nanum Pen Script",cursive;font-size:17px;color:#7a5a3c;border-bottom:1.5px solid rgba(90,56,28,.35)}
.sheet.paper .meta button{font-family:"Nanum Pen Script",cursive;font-size:18px;color:#7a2e18;text-decoration:underline;text-underline-offset:3px}
.sheet.paper .closeX{border:1.5px solid rgba(70,40,18,.55);color:#4a2a14;background:transparent;width:34px;height:34px}
.sheet.paper .rooms{display:flex;flex-direction:column;gap:0;padding:4px 2px 2px;scrollbar-width:none}
.sheet.paper .room{background:none;border:0;border-bottom:1px dashed rgba(90,56,28,.35);border-radius:0;padding:9px 2px 8px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"b span" "em em";align-items:baseline;column-gap:10px;row-gap:5px}
.sheet.paper .room:last-child{border-bottom:0}
.sheet.paper .room b{grid-area:b;font-family:"Nanum Pen Script",cursive;font-weight:400;font-size:27px;line-height:1.05;color:#2e180a}
.sheet.paper .room em{grid-area:em;font-size:11.5px;color:#8a6a4a;letter-spacing:.02em}
.sheet.paper .room span{grid-area:span;font-family:"Nanum Pen Script",cursive;font-size:19px;color:#6a4a2c;white-space:nowrap}
.sheet.paper .room.cur b{text-decoration:underline wavy rgba(150,40,20,.7);text-underline-offset:2px;text-decoration-thickness:1.2px}
.sheet.paper .room.cur span,.sheet.paper .room.cur em{color:#9a2e14}
.sheet.paper .room:active{background:rgba(120,80,40,.08)}
.closeX{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}

.sheet.info{width:min(480px,100%)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 20px 12px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--gold-soft);border-color:rgba(216,179,106,.5);color:var(--gold)}
.info-body{overflow-y:auto;padding:4px 20px 22px;font-size:13.5px;line-height:1.7;user-select:text;-webkit-user-select:text}
.info-body h4{margin:18px 0 8px;font-size:12px;letter-spacing:.06em;color:var(--gold);font-weight:500}
.info-body p{margin:0 0 8px}
.info-body .fine{font-size:12px;color:var(--muted)}
.info-body ol,.info-body ul{margin:0 0 8px;padding-left:20px}
.info-body li{margin:2px 0}
.info-body details{border-top:1px solid var(--line)}
.info-body details:last-of-type{border-bottom:1px solid var(--line)}
.info-body summary{padding:12px 0;cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:12px}
.info-body summary::-webkit-details-marker{display:none}
.info-body summary::after{content:"+";color:var(--muted)}
.info-body details[open] summary::after{content:"\2212"}
.info-body details p{font-family:var(--display);white-space:pre-line}
.season,.about{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--line);margin:4px 0 12px}
.about{flex-direction:column;align-items:flex-start;gap:4px}
.about span{font-size:11.5px;color:var(--gold);letter-spacing:.04em}
.about b{font-family:var(--display);font-size:19px}
.about p{margin:2px 0 0;font-size:13px}
.season .swatch{width:36px;height:36px;border-radius:50%;background:var(--sw);flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.season b{display:block;font-family:var(--display);font-size:18px}
.season span{font-size:12px;color:var(--muted)}
.feasts{list-style:none;padding:0!important}
.feasts li{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline;margin:0}
.feasts li > span{min-width:0}
.feasts .d{color:var(--gold);font-variant-numeric:tabular-nums;font-size:12.5px}
.feasts .date{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.feasts em{font-style:normal;font-size:10.5px;margin-left:6px;padding:1px 6px;border-radius:999px;border:1px solid rgba(216,179,106,.5);color:var(--gold);white-space:nowrap}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12.5px;margin-bottom:8px}
.resp div{min-width:0}
.resp .p{color:var(--muted)}
.part{font-family:var(--display);font-size:15px;font-weight:700;margin:16px 0 6px}
.sac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.sac div{padding:10px 12px;border-radius:12px;border:1px solid var(--line);min-width:0}
.sac b{display:block;font-size:13.5px}
.sac span{display:block;font-size:12px;color:var(--muted);line-height:1.55}
.spot-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.spot-row div{min-width:0}
.spot-row b{display:block;font-size:13.5px}
.spot-row span{font-size:12px;color:var(--muted)}
.info-body .pill{flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;margin-bottom:8px}
.week div{padding:6px 2px;border-radius:10px;border:1px solid var(--line);line-height:1.4}
.week .today{border-color:rgba(216,179,106,.6);color:var(--gold)}

.objcard{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 98px);width:min(calc(100% - 32px),400px);border-radius:20px;padding:14px 14px 14px 18px;z-index:7;max-height:46vh;overflow-y:auto;background:var(--glass-strong)}
.oc-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.objcard .eyebrow{font-size:11px;letter-spacing:.06em;color:var(--gold)}
.objcard h3{margin:2px 0 0;font-family:var(--display);font-size:18px;text-wrap:balance}
.objcard p{margin:8px 0 12px;font-size:13px;line-height:1.65;white-space:pre-line}
.oc-act{display:flex;gap:8px;flex-wrap:wrap}

/* entry & wardrobe */
.entry{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;pointer-events:none}
.e-top{text-align:center;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;font-weight:700}
.brand svg{width:20px;height:20px;color:var(--gold)}
.e-top p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.e-stage{flex:1;min-height:110px;pointer-events:auto;touch-action:none;cursor:grab}
.e-sheet{pointer-events:auto;width:min(560px,100%);margin:0 auto;box-sizing:border-box;max-height:62%;min-height:0;display:flex;flex-direction:column;gap:12px;background:var(--glass-strong);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding-top:18px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.e-label{font-size:12px;color:var(--muted)}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;min-width:0;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(239,232,218,.05);color:var(--fg);font:500 16px var(--body);padding:0 14px;user-select:text;-webkit-user-select:text}
.name-row input::placeholder{color:var(--muted)}
.dice{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.saints{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;margin-top:-4px}
.saints::-webkit-scrollbar{display:none}
.saints button{flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.e-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.e-tabs::-webkit-scrollbar{display:none}
.e-tabs button{flex:none;padding:8px 10px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.e-tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold);font-weight:500}
.e-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;overflow-y:auto;min-height:70px;flex:1;align-content:start}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(239,232,218,.03);font-size:12px;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.opt .sw{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.opt svg{width:30px;height:30px}
.enter{height:52px;border-radius:16px;background:var(--gold);color:#1a140a;font-size:15px;font-weight:700;flex:none}
.enter:disabled{opacity:.4;cursor:not-allowed}

/* rosary */
.rosary{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 80% at 50% 30%,#1d1a24 0%,#0c0b11 70%);display:flex;flex-direction:column}
.rosary canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.r-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.r-top .pill{height:38px}
.r-bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.r-bottom > *{pointer-events:auto}
.r-info{min-width:0;max-width:min(62vw,380px)}
.r-count{font-family:var(--display);font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.r-count small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.r-name{margin-top:8px;font-size:14px;font-weight:500;color:var(--gold)}
.r-mys{margin-top:4px;font-size:12.5px;line-height:1.5;text-wrap:balance}
.r-text{margin-top:8px;font-family:var(--display);font-size:13px;line-height:1.7;color:var(--muted);max-height:6.8em;overflow-y:auto}
.r-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}

/* ================= texture painters ================= */
function floorCanvas(F){
  return cnv(512,512,(g,w)=>{
    const noise=(n,a)=>{ for(let k=0;k<n;k++){ g.fillStyle=`rgba(255,245,230,${Math.random()*a})`; g.fillRect(Math.random()*w,Math.random()*w,2,2);} };
    const lines=(n,c)=>{ g.strokeStyle=c; g.lineWidth=2; const s=w/n; for(let i=0;i<=n;i++){ g.beginPath(); g.moveTo(i*s,0); g.lineTo(i*s,w); g.stroke(); g.beginPath(); g.moveTo(0,i*s); g.lineTo(w,i*s); g.stroke(); } };
    if(F.type==='diamond'){
      g.fillStyle=F.a; g.fillRect(0,0,w,w); g.save(); g.translate(w/2,w/2); g.rotate(Math.PI/4); const s=w/(4*Math.SQRT2);
      for(let i=-10;i<10;i++) for(let j=-10;j<10;j++){ g.fillStyle=(((i+j)%2)+2)%2?F.b:F.a; g.fillRect(i*s,j*s,s,s); }
      g.strokeStyle='rgba(0,0,0,.25)'; g.lineWidth=2; for(let i=-10;i<10;i++){ g.beginPath(); g.moveTo(i*s,-w*2); g.lineTo(i*s,w*2); g.stroke(); g.beginPath(); g.moveTo(-w*2,i*s); g.lineTo(w*2,i*s); g.stroke(); }
      g.restore(); noise(900,.05);
    } else if(F.type==='circles'){
      marble(g.canvas,F.a,'#8c7c6c',2,.6); const s=w/2;
      for(let i=0;i<2;i++) for(let j=0;j<2;j++){ const x=i*s, y=j*s; g.fillStyle=F.b; g.fillRect(x,y,s,16); g.fillRect(x,y,16,s);
        g.fillStyle=(i+j)%2?F.c:F.b; g.beginPath(); g.arc(x+s/2,y+s/2,s*.3,0,Math.PI*2); g.fill(); g.strokeStyle=F.a; g.lineWidth=6; g.beginPath(); g.arc(x+s/2,y+s/2,s*.36,0,Math.PI*2); g.stroke(); }
      noise(900,.05);
    } else if(F.type==='terrazzo'){
      g.fillStyle=F.a; g.fillRect(0,0,w,w); for(let k=0;k<2600;k++){ g.fillStyle=Math.random()<.7?F.b:'#a89a84'; const r=Math.random()*3+1; g.beginPath(); g.arc(Math.random()*w,Math.random()*w,r,0,Math.PI*2); g.fill(); }
    } else if(F.type==='milan'){
      marble(g.canvas,F.a,'#9a8e80',2,.6); const s=w/2;
      for(let i=0;i<2;i++) for(let j=0;j<2;j++){ const x=i*s,y=j*s; g.fillStyle=F.b; g.fillRect(x,y,s,10); g.fillRect(x,y,10,s);
        g.save(); g.translate(x+s/2,y+s/2); g.rotate(Math.PI/4); g.fillStyle=F.c; g.fillRect(-s*.24,-s*.24,s*.48,s*.48); g.fillStyle=F.a; g.fillRect(-s*.14,-s*.14,s*.28,s*.28); g.restore();
        g.fillStyle=F.b; g.beginPath(); g.arc(x+s/2,y+s/2,s*.06,0,Math.PI*2); g.fill(); }
      grainOver(g.canvas,.12,4);
    } else if(F.type==='stripes'){
      for(let i=0;i<8;i++){ g.fillStyle=i%2?F.b:F.a; g.fillRect(0,i*w/8,w,w/8); } g.fillStyle='rgba(0,0,0,.12)'; for(let i=0;i<8;i++) g.fillRect(0,i*w/8,w,2); grainOver(g.canvas,.16,6);
    } else {
      const n=4,s=w/n; for(let i=0;i<n;i++) for(let j=0;j<n;j++){ g.fillStyle=(i+j)%2?F.b:F.a; g.fillRect(i*s,j*s,s,s); } noise(1200,.04); lines(4,'rgba(0,0,0,.35)');
    }
  });
}
function wallCanvas(W){
  return cnv(256,256,(g,w,h)=>{
    if(W.type==='brick'){
      g.fillStyle='#2a201c'; g.fillRect(0,0,w,h); const bh=16,bw=64;
      for(let r=0;r<h/bh;r++){ const off=(r%2)*bw/2, band=(r%8===0||r%8===1); for(let x=-bw;x<w+bw;x+=bw){ g.fillStyle=shade(band?W.b:W.a,Math.random()*20-10); g.fillRect(x+off+1,r*bh+1,bw-2,bh-2);} }
    } else if(W.type==='stone'){
      g.fillStyle=shade(W.a,-40); g.fillRect(0,0,w,h); const bh=32,bw=64;
      for(let r=0;r<h/bh;r++){ const off=(r%2)*bw/2; for(let x=-bw;x<w+bw;x+=bw){ g.fillStyle=shade(Math.random()<.5?W.a:W.b,Math.random()*14-7); g.fillRect(x+off+1.5,r*bh+1.5,bw-3,bh-3);} }
      for(let k=0;k<500;k++){ g.fillStyle=`rgba(0,0,0,${Math.random()*.06})`; g.fillRect(Math.random()*w,Math.random()*h,3,3); }
      grainOver(g.canvas,.38,8);
    } else if(W.type==='marble'){
      marble(g.canvas,W.a,shade(W.b,-50).replace(/rgb\((\d+),(\d+),(\d+)\)/,(m,r,gg,b)=>'#'+[r,gg,b].map(x=>(+x).toString(16).padStart(2,'0')).join('')),2,.8);
      g.fillStyle='rgba(0,0,0,.16)'; for(let y=0;y<h;y+=64) g.fillRect(0,y,w,2); for(let y=0;y<h;y+=64) for(let x=((y/64)%2)*64;x<w;x+=128) g.fillRect(x,y,2,64);
    } else {
      g.fillStyle=W.a; g.fillRect(0,0,w,h); grainOver(g.canvas,.14,6);
    }
  });
}

function tapAt(cx,cy){
  if(!C||!me) return;
  ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const hit=new THREE.Vector3(), onFloor=!!ray.ray.intersectPlane(groundPlane,hit), floorD=onFloor?camera.position.distanceTo(hit):1e9;
  const hs=ray.intersectObjects(C.hs,true);
  if(NET.peers.size){ const ph=ray.intersectObjects([...NET.peers.values()].map(q=>q.g),true)[0];
    if(ph&&ph.distance<14&&ph.distance<floorD){ let o=ph.object; while(o&&!o.userData.peer) o=o.parent; const q=o&&NET.peers.get(o.userData.peer); if(q){ greetTo(q); return; } } }
  if(hs.length&&hs[0].distance<16&&hs[0].distance<floorD-.3){ let o=hs[0].object; while(o&&!o.userData.spot) o=o.parent; if(o){ showSpot(o.userData.spot,false); return; } }

  if(inCenter(hit.x,hit.z)&&performance.now()-(tapAt.ct||0)>8000){ tapAt.ct=performance.now(); toast('가운데 통로는 행렬을 위해 비워 두고, 옆 통로로 다녀요'); }
  let dest={x:hit.x,z:hit.z};

  goTo(dest);

}

function bellStrike(t,f,vol){
  [[.5,1,5],[1,.8,4.5],[1.19,.45,3],[1.56,.32,2.5],[2,.28,2.2],[2.51,.18,1.8],[3.01,.1,1.4]].forEach(([r,a,dur])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f*r;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol*a,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(master); g.connect(verb); o.start(t); o.stop(t+dur+.1); });
}
function ringAngelusBells(){ if(!soundOn()) return; const t0=actx.currentTime+.1, f=mf(55);
  [0,1,2].forEach(g=>{ for(let i=0;i<3;i++) bellStrike(t0+g*4.6+i*1.2,f,.08); }); for(let i=0;i<9;i++) bellStrike(t0+13.8+i*1.2,f,.08); }

}

function adoreMusic(on){

  const play=()=>{ const t=actx.currentTime+.05, ch=pick([[50,57,62,66],[47,54,59,62],[43,50,55,59],[45,52,57,61],[48,55,60,64]]);

function beginAdore(){

function updateAdore(t,dt){

    if(composer){ if(composer.setPixelRatio) composer.setPixelRatio(pr); composer.setSize(innerWidth,innerHeight); }
    if(bloom) bloom.enabled=l<2; renderer.shadowMap.autoUpdate=false; this.shadowEvery=l>=3?0:(MOBILE?4:2); renderer.shadowMap.needsUpdate=true; },
  hold(){ this.wait=4; this.acc=0; this.n=0; },
  tick(dt){ if(document.hidden) return; if(this.wait>0){ this.wait-=dt; return; } this.acc+=dt; this.n++;
    if(this.acc<2.5) return; const fps=this.n/this.acc; this.acc=0; this.n=0;
    if(fps<38&&this.lvl<4){ this.lvl++; this.good=0; if(this.upped) this.locked=true; store.set('qlvl',this.lvl); this.apply(); this.wait=2; }
    else if(fps>56&&this.lvl>0&&!this.locked){ if(++this.good>=4){ this.good=0; this.upped=true; this.lvl--; store.set('qlvl',this.lvl); this.apply(); this.wait=2; } } else this.good=0; } };
QUAL.apply();

/* ================= 온라인(서버) : 함께 접속한 사람 보기 · 초 봉헌 공유 =================
   서버(server.js)에서 열었을 때만 켜져요. 파일로 열거나 미리보기에서는 혼자 모드로 동작해요. */
const BAD_NAME=['시발','씨발','씨팔','ㅅㅂ','ㅆㅂ','병신','ㅂㅅ','개새','새끼','좆','존나','졸라','니미','느금','지랄','염병','미친놈','미친년','썅','fuck','shit','bitch','sex','섹스','porn','야동','자지','보지'];
const badName=n=>{ const t=String(n).toLowerCase().replace(/[\s\d._\-~!@#$%^&*()+=]/g,''); return BAD_NAME.some(w=>t.includes(w)); };
const NET={booth:null, inQueue:false, qPos:0, MAX:50, on:false, sock:null, peers:new Map(), counts:{}, room:-1, last:0, lastKey:'',
  count(i){ return this.counts[i]||0; },
  init(){ if(!/^https?:$/.test(location.protocol)) return;
    fetch('/api/health').then(r=>r.ok?r.json():null).then(j=>{ if(!j||!j.ok) return;
      const sc=document.createElement('script'); sc.src='/socket.io/socket.io.js'; sc.onload=()=>this.connect(); document.head.appendChild(sc); }).catch(()=>{}); },
  connect(){ const s=this.sock=io({transports:['websocket','polling']});
    s.on('connect',()=>{ this.on=true; if(C) clearNPCs(); if(room>=0&&me) this.join(room,true); });
    s.on('full',r=>{ if(r!==room) return; this.room=-1; toast(`이 성당은 가득 찼어요 (최대 ${this.MAX}명) · 다른 성당을 골라 주세요`); renderRooms(); $('roomSheet').hidden=false; });
    s.on('disconnect',()=>{ this.on=false; this.room=-1; this.clear(); if(C&&mode!=='entry') spawnNPCs(roomCounts[room]-1); });
    s.on('counts',c=>{ this.counts=c; if(mode!=='entry') $('headcount').textContent=this.count(room); if(!$('roomSheet').hidden) renderRooms(); });
    s.on('peers',list=>{ this.clear(); list.forEach(p=>this.add(p)); });
    s.on('peer:join',p=>{ this.add(p); toast(`${p.name}님이 들어왔어요`); });
    s.on('peer:leave',id=>{ const p=this.peers.get(id); if(p){ scene.remove(p.g); disposeLabel(p); this.peers.delete(id); } });
    s.on('peer:state',d=>{ const p=this.peers.get(d.id); if(!p) return; p.tx=d.x; p.tz=d.z; p.face=d.f; p.netPose=d.p; });
    s.on('peer:look',d=>{ const p=this.peers.get(d.id); if(!p) return; scene.remove(p.g); disposeLabel(p); this.peers.delete(d.id); this.add(Object.assign(d,{x:p.g.position.x,z:p.g.position.z,f:p.face,p:p.netPose})); });
    s.on('greet:req',d=>{ const q=this.peers.get(d.id); if(q) showGreetReq(q); });
    s.on('greet:do',d=>{ const P=id=>id===s.id?me:this.peers.get(id); const A=P(d.a), B=P(d.b); nod(A,B); nod(B,A); if(A===me||B===me) hideGreetReq(); });
    s.on('candle',d=>{ if(d.room!==room) return; if(d.id!==s.id){ try{ C.lightVotive(); }catch(e){} toast(`${d.name}님이 초를 봉헌했어요 · 오늘 이 성당 ${d.total}개`); } }); },
  add(p){ if(!me||this.peers.has(p.id)) return; const look=Object.assign(randomLook(),p.look||{}); const q=buildPerson(look,{label:p.name,speed:2.6,peer:true});
    q.id=p.id; q.name=p.name; q.g.userData.peer=p.id; q.tx=p.x; q.tz=p.z; q.face=p.f||Math.PI; q.netPose=p.p||'stand'; q.g.position.set(p.x,0,p.z); q.g.rotation.y=q.face; scene.add(q.g); this.peers.set(p.id,q); },
  clear(){ this.peers.forEach(p=>{ scene.remove(p.g); disposeLabel(p); }); this.peers.clear(); },
  join(i,force){ if(!this.on||!me) return; if(this.room===i&&!force) return; this.room=i; this.clear(); this.booth=null; this.inQueue=false; applyBoothState();
    const l=me.look||store.get('look',{}); this.sock.emit('join',{room:i,name:l.name||'순례자',look:this.pack(l),x:me.g.position.x,z:me.g.position.z,f:me.face,p:me.pose}); },
  pack(l){ return {hair:l.hair,hairColor:l.hairColor,outfit:l.outfit,acc:l.acc,skin:l.skin}; },
  look(l){ if(this.on&&this.room>=0) this.sock.emit('look',{name:l.name,look:this.pack(l)}); },
  candle(){ if(this.on) this.sock.emit('candle'); },
  greet(to){ if(this.on&&this.room>=0&&to) this.sock.emit('greet',{to}); },
  update(t,dt){ if(!this.on||!me) return;
    const P=me.g.position, key=`${P.x.toFixed(2)},${P.z.toFixed(2)},${me.face.toFixed(2)},${me.pose}`;
    if(t-this.last>.15&&key!==this.lastKey){ this.last=t; this.lastKey=key; this.sock.volatile.emit('state',{x:+P.x.toFixed(2),z:+P.z.toFixed(2),f:+me.face.toFixed(2),p:me.pose}); }
    this.peers.forEach(p=>{ const dx=p.tx-p.g.position.x, dz=p.tz-p.g.position.z, d=Math.hypot(dx,dz), moving=d>.05;
      if(d>6){ p.g.position.x=p.tx; p.g.position.z=p.tz; } else { const k=Math.min(1,dt*8); p.g.position.x+=dx*k; p.g.position.z+=dz*k; }
      p.g.visible=!(this.booth&&this.booth.busy&&this.booth.id===p.id); p.pose=moving?'stand':p.netPose; turn(p); applyPose(p,t,moving);
      const dc=camera.position.distanceTo(p.g.position); p.label.material.opacity=clamp((14-dc)/3,0,1)*clamp((dc-3.6)/.6,0,1); p.label.visible=p.label.material.opacity>0; }); }
};
NET.init();

openEntry(false);
frame();
})();

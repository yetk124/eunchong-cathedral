    <p class="fine">\uD55C\uAD6D\uCC9C\uC8FC\uAD50\uC8FC\uAD50\uD68C\uC758 \uAE30\uB3C4\uC11C\uC640 \u300C\uB85C\uB9C8 \uBBF8\uC0AC \uACBD\uBCF8 \uCD1D\uC9C0\uCE68\u300D, \u300C\uAC00\uD1A8\uB9AD \uAD50\uD68C \uAD50\uB9AC\uC11C\u300D\uB97C \uBC14\uD0D5\uC73C\uB85C \uC815\uB9AC\uD588\uC5B4\uC694. \uC2E4\uC81C \uBCF8\uB2F9\uC758 \uC548\uB0B4\uAC00 \uB2E4\uB97C \uB54C\uB294 \uBCF8\uB2F9 \uC548\uB0B4\uB97C \uB530\uB77C \uC8FC\uC138\uC694.</p>`},etiquette(){return`<h4>\uC131\uB2F9\uC5D0 \uB4E4\uC5B4\uAC08 \uB54C \xB7 \uC131\uC218\uC640 \uC131\uD638\uACBD</h4><p>\uC785\uAD6C \uC131\uC218\uB300\uC5D0 \uC624\uB978\uC190 \uC190\uAC00\uB77D \uB05D\uC744 \uC0B4\uC9DD \uC801\uC154 \uC774\uB9C8, \uAC00\uC2B4, \uC67C\uCABD \uC5B4\uAE68, \uC624\uB978\uCABD \uC5B4\uAE68 \uC21C\uC11C\uB85C \uC2ED\uC790\uAC00\uB97C \uADF8\uC73C\uBA70 "\uC131\uBD80\uC640 \uC131\uC790\uC640 \uC131\uB839\uC758 \uC774\uB984\uC73C\uB85C. \uC544\uBA58." \uD558\uACE0 \uB9C8\uC74C\uC18D\uC73C\uB85C \uBC14\uCCD0\uC694. \uC138\uB840\uB97C \uAE30\uC5B5\uD558\uBA70 \uB9C8\uC74C\uC744 \uAE68\uB057\uC774 \uD558\uB294 \uD45C\uC2DC\uC608\uC694. \uC2E0\uC790\uAC00 \uC544\uB2C8\uB77C\uBA74 \uC131\uC218\uB97C \uCC0D\uC9C0 \uC54A\uC544\uB3C4 \uAD1C\uCC2E\uC544\uC694.</p>
    <h4>\uC131\uB2F9 \uC548\uC5D0\uC11C \uC870\uC6A9\uD788 \uD558\uB294 \uC774\uC720</h4><p>\uC131\uB2F9\uC740 \uD558\uB290\uB2D8\uAED8 \uAE30\uB3C4\uB4DC\uB9AC\uB294 \uC9D1\uC774\uACE0, \uAC10\uC2E4\uC5D0\uB294 \uC131\uCCB4 \uC548\uC5D0 \uACC4\uC2E0 \uC8FC\uB2D8\uC774 \uBAA8\uC154\uC838 \uC788\uC5B4\uC694. \uB610 \uACC1\uC5D0\uC11C \uAE30\uB3C4\uD558\uB294 \uC0AC\uB78C\uB4E4\uC774 \uC788\uC5B4\uC694. \uAF2D \uD574\uC57C \uD560 \uC774\uC57C\uAE30\uB294 \uC791\uC740 \uBAA9\uC18C\uB9AC\uB85C \uC9E7\uAC8C \uD558\uAC70\uB098 \uC131\uB2F9 \uBC16\uC5D0\uC11C \uD574\uC694.</p>
    <h4>\uAC10\uC2E4\uC744 \uD5A5\uD55C \uC808 \xB7 \uBB34\uB98E\uC808</h4><p>\uAC10\uC2E4 \uC55E\uC744 \uC9C0\uB098\uAC70\uB098 \uC790\uB9AC\uC5D0 \uB4E4\uC5B4\uAC00\uAE30 \uC804, \uAC10\uC2E4\uC744 \uD5A5\uD574 \uD5C8\uB9AC\uB97C \uC219\uC5EC \uAE4A\uC774 \uC808\uD558\uAC70\uB098 \uC624\uB978\uCABD \uBB34\uB98E\uC744 \uBC14\uB2E5\uAE4C\uC9C0 \uAFC7\uC5C8\uB2E4 \uC77C\uC5B4\uB098\uB294 \uBB34\uB98E\uC808(\uADA4\uBC30)\uC744 \uD574\uC694. \uC131\uCCB4 \uC548\uC5D0 \uACC4\uC2E0 \uC8FC\uB2D8\uAED8 \uB4DC\uB9AC\uB294 \uD760\uC22D\uC758 \uD45C\uC2DC\uC608\uC694. \uD55C\uAD6D \uC131\uB2F9\uC5D0\uC11C\uB294 \uAE4A\uC740 \uC808\uC744 \uD558\uB294 \uACBD\uC6B0\uAC00 \uB9CE\uACE0, \uBCF8\uB2F9 \uAD00\uC2B5\uC744 \uB530\uB974\uBA74 \uB3FC\uC694. \uBB34\uB98E\uC774 \uBD88\uD3B8\uD558\uBA74 \uACE0\uAC1C\uB97C \uC219\uC774\uB294 \uAC83\uC73C\uB85C \uCDA9\uBD84\uD574\uC694.</p>
    <h4>\uC81C\uB300 \uC8FC\uBCC0 \uC608\uC808</h4><p>\uC81C\uB300\uB294 \uBBF8\uC0AC\uC758 \uC131\uCC2C\uB840\uAC00 \uAC70\uD589\uB418\uB294 \uAC70\uB8E9\uD55C \uC2DD\uD0C1\uC774\uC790 \uADF8\uB9AC\uC2A4\uB3C4\uB97C \uC0C1\uC9D5\uD574\uC694. \uC81C\uB300\uAC00 \uC788\uB294 \uC81C\uB2E8\uC5D0\uB294 \uC804\uB840 \uBD09\uC0AC\uC790\uAC00 \uC544\uB2C8\uBA74 \uC62C\uB77C\uAC00\uC9C0 \uC54A\uACE0, \uC81C\uB300 \uC704\uC5D0 \uBB3C\uAC74\uC744 \uC62C\uB824 \uB450\uC9C0 \uC54A\uC544\uC694. \uC81C\uB300 \uC55E\uC744 \uC9C0\uB0A0 \uB54C\uB294 \uAE4A\uC774 \uC808\uD574\uC694.</p>
    <h4>\uC131\uB2F9 \uC548\uC5D0\uC11C \uC6C0\uC9C1\uC77C \uB54C</h4><ul><li>\uB6F0\uC9C0 \uC54A\uACE0 \uCC9C\uCC9C\uD788 \uAC78\uC5B4\uC694.</li><li>\uC911\uC559 \uD1B5\uB85C\uB294 \uB9C9\uD78C \uACF3\uC774 \uC544\uB2C8\uC5D0\uC694. \uB2E4\uB9CC \uBBF8\uC0AC\uC758 \uC785\uB2F9\xB7\uD1F4\uC7A5 \uD589\uB82C\uACFC \uC601\uC131\uCCB4 \uD589\uB82C\uC774 \uC9C0\uB098\uAC00\uB294 \uAE38\uC774\uB77C, \uD3C9\uC18C\uC5D0\uB294 \uC606 \uD1B5\uB85C\uB97C \uC774\uC6A9\uD558\uBA74 \uC88B\uC544\uC694. \uC774 \uC571\uC5D0\uC11C\uB3C4 \uCE90\uB9AD\uD130\uAC00 \uC591\uC606 \uD1B5\uB85C\uB85C \uB2E4\uB2C8\uB3C4\uB85D \uC548\uB0B4\uD574\uC694.</li><li>\uBBF8\uC0AC \uC911\uC5D0\uB294 \uB420 \uC218 \uC788\uB294 \uB300\uB85C \uC6C0\uC9C1\uC774\uC9C0 \uC54A\uACE0, \uB2A6\uAC8C \uC654\uB2E4\uBA74 \uB4A4\uCABD \uC790\uB9AC\uC5D0 \uC870\uC6A9\uD788 \uC549\uC544\uC694.</li><li>\uAE30\uB3C4\uD558\uB294 \uC0AC\uB78C \uBC14\uB85C \uC55E\uC744 \uAC00\uB85C\uC9C0\uB974\uC9C0 \uC54A\uC544\uC694.</li></ul>
    <h4>\uD734\uB300\uC804\uD654\uC640 \uB300\uD654</h4><ul><li>\uB4E4\uC5B4\uAC00\uAE30 \uC804\uC5D0 \uBB34\uC74C\uC73C\uB85C \uBC14\uAFB8\uAC70\uB098 \uAEBC\uC694.</li><li>\uBBF8\uC0AC \uC911\uC5D0\uB294 \uD1B5\uD654, \uBA54\uC2DC\uC9C0, \uC0AC\uC9C4 \uCD2C\uC601\uC744 \uD558\uC9C0 \uC54A\uC544\uC694.</li><li>\uAE09\uD55C \uC5F0\uB77D\uC740 \uC7A0\uC2DC \uC131\uB2F9 \uBC16\uC73C\uB85C \uB098\uAC00\uC11C \uD574\uC694.</li></ul>`},terms(){return`<div class="sac">${[["\uC81C\uB300","\uBBF8\uC0AC \uC911 \uC131\uCC2C\uB840\uAC00 \uAC70\uD589\uB418\uB294 \uAC70\uB8E9\uD55C \uC2DD\uD0C1\uC774\uC5D0\uC694. \uADF8\uB9AC\uC2A4\uB3C4\uB97C \uC0C1\uC9D5\uD574\uC694."],["\uAC10\uC2E4","\uBBF8\uC0AC\uC5D0\uC11C \uCD95\uC131\uB41C \uC131\uCCB4\uB97C \uBAA8\uC154 \uB450\uB294 \uACF3\uC774\uC5D0\uC694. \uACC1\uC5D0 \uC131\uCCB4\uB4F1\uC774 \uB298 \uCF1C\uC838 \uC788\uC5B4 \uC8FC\uB2D8\uAED8\uC11C \uACC4\uC2EC\uC744 \uC54C\uB824\uC694."],["\uC131\uCCB4","\uBBF8\uC0AC \uC911\uC5D0 \uCD95\uC131\uB41C \uBE75\uC774\uC5D0\uC694. \uAC00\uD1A8\uB9AD \uAD50\uD68C\uB294 \uADF8 \uC548\uC5D0 \uC608\uC218 \uADF8\uB9AC\uC2A4\uB3C4\uAED8\uC11C \uCC38\uC73C\uB85C \uD604\uC874\uD558\uC2E0\uB2E4\uACE0 \uBBFF\uC5B4\uC694. \uADF8\uB798\uC11C \uAC70\uB8E9\uD558\uAC8C \uBAA8\uC2DC\uACE0 \uACF5\uACBD\uD574\uC694."],["\uC131\uD608","\uBBF8\uC0AC \uC911\uC5D0 \uCD95\uC131\uB41C \uD3EC\uB3C4\uC8FC\uB85C, \uADF8\uB9AC\uC2A4\uB3C4\uC758 \uD53C\uC608\uC694."],["\uC131\uCCB4 \uC870\uBC30","\uAC10\uC2E4\uC774\uB098 \uD604\uC2DC\uB41C \uC131\uCCB4 \uC55E\uC5D0 \uBA38\uBB3C\uBA70 \uC8FC\uB2D8\uAED8 \uD760\uC22D\uACFC \uAC10\uC0AC, \uC0AC\uB791\uC744 \uB4DC\uB9AC\uB294 \uAE30\uB3C4\uC608\uC694."],["\uACE0\uD574\uC131\uC0AC","\uC138\uB840 \uB4A4\uC5D0 \uC9C0\uC740 \uC8C4\uB97C \uB258\uC6B0\uCE58\uACE0 \uC0AC\uC81C\uC5D0\uAC8C \uACE0\uBC31\uD558\uC5EC \uD558\uB290\uB2D8\uC758 \uC6A9\uC11C\uB97C \uBC1B\uB294 \uC131\uC0AC\uC608\uC694. \uC0AC\uC81C\uB294 \uB4E4\uC740 \uB0B4\uC6A9\uC744 \uC5B4\uB5A4 \uACBD\uC6B0\uC5D0\uB3C4 \uBC1D\uD790 \uC218 \uC5C6\uC5B4\uC694."],["\uC601\uC131\uCCB4","\uBBF8\uC0AC\uC5D0\uC11C \uC131\uCCB4\uB97C \uBAA8\uC2DC\uB294 \uAC83\uC774\uC5D0\uC694. \uD569\uB2F9\uD55C \uC900\uBE44\uAC00 \uD544\uC694\uD55C \uC131\uC0AC\uC608\uC694."],["\uBB35\uC8FC\uAE30\uB3C4","\uBB35\uC8FC\uB97C \uB530\uB77C \uC8FC\uB2D8\uC758 \uAE30\uB3C4, \uC131\uBAA8\uC1A1, \uC601\uAD11\uC1A1\uC744 \uBC14\uCE58\uBA70 \uC608\uC218\uB2D8\uACFC \uC131\uBAA8\uB2D8 \uC0DD\uC560\uC758 \uC2E0\uBE44\uB97C \uBB35\uC0C1\uD558\uB294 \uAE30\uB3C4\uC608\uC694."],["\uB300\uB9BC \uC2DC\uAE30","\uC131\uD0C4\uC744 \uAE30\uB2E4\uB9AC\uBA70 \uC900\uBE44\uD558\uB294 \uC57D 4\uC8FC\uAC04\uC774\uC5D0\uC694. \uC804\uB840 \uC0C9\uC740 \uC790\uC0C9\uC774\uC5D0\uC694."],["\uC0AC\uC21C \uC2DC\uAE30","\uC7AC\uC758 \uC218\uC694\uC77C\uBD80\uD130 \uC131\uBAA9\uC694\uC77C \uC8FC\uB2D8 \uB9CC\uCC2C \uBBF8\uC0AC \uC804\uAE4C\uC9C0, \uAE30\uB3C4\xB7\uB2E8\uC2DD\xB7\uC790\uC120\uC73C\uB85C \uBD80\uD65C\uC744 \uC900\uBE44\uD558\uB294 \uC2DC\uAE30\uC608\uC694. \uC804\uB840 \uC0C9\uC740 \uC790\uC0C9\uC774\uC5D0\uC694."],["\uBD80\uD65C \uC2DC\uAE30","\uBD80\uD65C \uB300\uCD95\uC77C\uBD80\uD130 \uC131\uB839 \uAC15\uB9BC \uB300\uCD95\uC77C\uAE4C\uC9C0 50\uC77C \uB3D9\uC548 \uC8FC\uB2D8\uC758 \uBD80\uD65C\uC744 \uAE30\uBED0\uD558\uB294 \uC2DC\uAE30\uC608\uC694. \uC804\uB840 \uC0C9\uC740 \uD770\uC0C9\uC774\uC5D0\uC694."],["\uC5F0\uC911 \uC2DC\uAE30","\uB300\uB9BC\xB7\uC131\uD0C4\xB7\uC0AC\uC21C\xB7\uBD80\uD65C \uC2DC\uAE30\uB97C \uBE80 \uB098\uBA38\uC9C0 \uAE30\uAC04\uC73C\uB85C, \uADF8\uB9AC\uC2A4\uB3C4\uC758 \uC0B6\uACFC \uAC00\uB974\uCE68\uC744 \uCC28\uADFC\uCC28\uADFC \uBB35\uC0C1\uD574\uC694. \uC804\uB840 \uC0C9\uC740 \uB179\uC0C9\uC774\uC5D0\uC694."]].map(t=>`<div><b>${t[0]}</b><span>${t[1]}</span></div>`).join("")}</div>`},first(){return`<h4>\uCC98\uC74C \uBC29\uBB38\uD560 \uB54C</h4><ul><li>\uAC00\uAE4C\uC6B4 \uC131\uB2F9\uC758 \uBBF8\uC0AC \uC2DC\uAC04\uC744 \uBCF8\uB2F9 \uD648\uD398\uC774\uC9C0\uB098 \uC0AC\uBB34\uC2E4\uC5D0\uC11C \uD655\uC778\uD574\uC694.</li><li>10\uBD84\uCBE4 \uC77C\uCC0D \uB3C4\uCC29\uD574 \uAC00\uC6B4\uB370\uB098 \uB4A4\uCABD\uC5D0 \uC549\uC73C\uBA74 \uC8FC\uBCC0\uC744 \uBCF4\uBA70 \uB530\uB77C \uD558\uAE30 \uC26C\uC6CC\uC694.</li><li>\uC785\uAD6C\uC5D0\uC11C \uB098\uB220 \uC8FC\uB294 \uC8FC\uBCF4\uB098 \u300C\uB9E4\uC77C\uBBF8\uC0AC\u300D\uB97C \uBCF4\uBA74 \uC21C\uC11C\uB97C \uB530\uB77C\uAC08 \uC218 \uC788\uC5B4\uC694.</li><li>\uCC98\uC74C\uC774\uB77C\uACE0 \uC0AC\uBB34\uC2E4\uC774\uB098 \uC548\uB0B4 \uBD09\uC0AC\uC790\uC5D0\uAC8C \uB9D0\uD558\uBA74 \uCE5C\uC808\uD558\uAC8C \uC54C\uB824 \uC918\uC694.</li></ul>
    <h4>\uBBF8\uC0AC\uC5D0 \uCC38\uC5EC\uD558\uB294 \uBC29\uBC95</h4><p>\uB2E4\uB978 \uC2E0\uC790\uB4E4\uC744 \uB530\uB77C \uC77C\uC5B4\uC11C\uACE0 \uC549\uACE0, \uC544\uB294 \uC751\uB2F5\uACFC \uC131\uAC00\uB294 \uD568\uAED8 \uD574\uC694. \uC798 \uBAA8\uB974\uB294 \uBD80\uBD84\uC740 \uC870\uC6A9\uD788 \uB4E4\uC73C\uBA70 \uB9C8\uC74C\uC73C\uB85C \uAE30\uB3C4\uD574\uB3C4 \uCDA9\uBD84\uD574\uC694. \uC790\uC138\uD55C \uC21C\uC11C\uB294 \u300C\uBBF8\uC0AC\u300D \uD0ED\uC5D0 \uC788\uC5B4\uC694.</p>
